<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        
        .bg-mesh {
            background-color: #f9f9ff;
            background-image: 
                radial-gradient(at 80% 0%, hsla(276, 91%, 47%, 0.1) 0px, transparent 50%),
                radial-gradient(at 0% 50%, hsla(276, 91%, 47%, 0.05) 0px, transparent 50%);
        }

        .input-glass {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s ease;
        }

        .input-glass:focus-within {
            border-color: #A540F3;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 0 4px rgba(165, 64, 243, 0.1);
        }

        .btn-gradient {
            background: linear-gradient(180deg, #b055f5 0%, #A540F3 100%);
        }
        
        .language-chip {
            transition: all 0.2s ease;
        }
        .language-chip.active {
            background-color: rgba(165, 64, 243, 0.1);
            color: #A540F3;
            border-color: rgba(165, 64, 243, 0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-mesh min-h-screen text-on-surface font-sans antialiased overflow-hidden flex flex-col items-center justify-center relative">
<!-- Ambient Decorative Elements -->
<div class="absolute top-[-10%] left-[-10%] w-64 h-64 rounded-full bg-primary/10 blur-3xl mix-blend-multiply pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-80 h-80 rounded-full bg-primary-container/10 blur-3xl mix-blend-multiply pointer-events-none"></div>
<main class="w-full max-w-md px-container-margin z-10 flex flex-col h-full sm:h-auto sm:justify-center">
<!-- Top App Bar / Language Selection -->
<header class="w-full pt-8 pb-4 flex justify-end items-center">
<div class="flex rounded-full p-1 bg-white/30 backdrop-blur-md border border-white/40 shadow-sm">
<button class="language-chip active font-label-md text-[11px] px-3 py-1.5 rounded-full border border-transparent">
                    English
                </button>
<button class="language-chip text-on-surface-variant font-label-md text-[11px] px-3 py-1.5 rounded-full border border-transparent hover:bg-white/40">
                    తెలుగు
                </button>
<button class="language-chip text-on-surface-variant font-label-md text-[11px] px-3 py-1.5 rounded-full border border-transparent hover:bg-white/40">
                    हिंदी
                </button>
</div>
</header>
<!-- Main Content Canvas -->
<section class="flex-grow flex flex-col justify-center mt-stack-gap-lg gap-8">
<div class="flex justify-center">
<img alt="InFio SEARCH Logo" class="h-40 w-auto object-contain drop-shadow-xl" src="https://lh3.googleusercontent.com/aida/AEtjO1UrG-56jzOHnblj1J9BTr7N4BEYCi4ogMRes2eiCXAaENM9gUg0c2m7ojoDHqYuQM3MK3vg8ciKNRN_pNM4-CXxbix84VfgOGChqeyolOSlCdYJdV7VNbzjJ5mpJvw6m76JukrO5NAipdQD7yN21VCvzjlZ7Obev4VOrsdvjadX2HTaOxz5J99HAgFMWw_YPya-7XBNQ3zMdQwF1ivt7XeYKggQsLApQI_4fRWnPUj85CNUYYv7K9v_4g"/>
</div>
<form class="flex flex-col gap-stack-gap-lg glass-panel p-8 rounded-3xl shadow-lg border-white/50">
<!-- Input Group -->
<div class="flex flex-col gap-unit">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="mobile">
                        Mobile Number
                    </label>
<div class="input-glass rounded-xl flex items-center px-4 h-14 overflow-hidden relative">
<span class="font-body-lg text-body-lg text-on-surface-variant mr-3 border-r border-outline-variant/30 pr-3">+91</span>
<input class="bg-transparent border-none outline-none w-full h-full font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/40 focus:ring-0 p-0" id="mobile" maxlength="10" placeholder="Enter 10 digit number" type="tel"/>
</div>
</div>
<!-- Action Button -->
<button class="btn-gradient w-full h-14 rounded-xl flex items-center justify-center gap-2 text-white font-title-md text-title-md shadow-[0_8px_30px_rgba(165,64,243,0.2)] hover:opacity-90 active:scale-[0.98] transition-all" style="background: linear-gradient(135deg, #a540f3 0%, #22c55e 100%);" type="button">
                    Send OTP
                    <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
<!-- Secondary Action -->
<div class="mt-4 text-center">
<button class="font-body-sm text-body-sm text-primary hover:text-primary-container transition-colors underline decoration-primary/30 underline-offset-4">
                    Skip for now
                </button>
</div>
</section>
</main>
<script>
        // Simple language toggle interaction for demo purposes
        document.querySelectorAll('.language-chip').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.language-chip').forEach(b => {
                    b.classList.remove('active');
                    b.classList.add('text-on-surface-variant');
                });
                e.target.classList.add('active');
                e.target.classList.remove('text-on-surface-variant');
            });
        });
    </script>
