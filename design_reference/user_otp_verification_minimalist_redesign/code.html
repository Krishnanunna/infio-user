<input class="glass-input w-full aspect-square rounded-xl border border-outline-variant text-center font-display-lg text-display-lg text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all shadow-sm" maxlength="1" pattern="\d*" type="number"/>

<!-- Resend Link -->

            Didn't receive code?

<script>
        // Simple logic to auto-advance OTP inputs
        const container = document.getElementById('otp-container');
        const inputs = container.querySelectorAll('input');

        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                // Ensure only one digit
                if(input.value.length > 1) {
                    input.value = input.value.slice(0, 1);
                }
                // Move to next input if filled
                if (input.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                // Move to previous input on backspace if empty
                if (e.key === 'Backspace' && input.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
            
            // Allow paste
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text/plain').trim().slice(0, 4);
                if (/^\d+$/.test(pastedData)) {
                    pastedData.split('').forEach((char, i) => {
                        if (inputs[i]) {
                            inputs[i].value = char;
                            if (i < inputs.length - 1) inputs[i + 1].focus();
                        }
                    });
                }
            });
        });
    </script>
