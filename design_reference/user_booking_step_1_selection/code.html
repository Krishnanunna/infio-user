<!DOCTYPE html>

<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9f9ff;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        .pt-safe {
            padding-top: env(safe-area-inset-top, 20px);
        }
        
        /* Smooth category selection transition */
        .sub-categories {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, opacity 0.3s ease-out, margin 0.3s ease-out;
        }
        .sub-categories.active {
            max-height: 500px;
            opacity: 1;
            margin-top: 16px;
        }
        
        /* Category Card Hover & Active States */
        .category-card {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .category-card.selected {
            border-color: #a540f3;
            background: rgba(165, 64, 243, 0.05);
            transform: scale(0.98);
        }
        
        .sub-category-chip {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .sub-category-chip.selected {
            background-color: #a540f3;
            color: #ffffff;
            border-color: #a540f3;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background antialiased flex flex-col min-h-screen">
<!-- Top App Bar (Modified for focused flow) -->
<header class="fixed top-0 w-full z-50 bg-white/70 backdrop-blur-xl border-b border-white/20 shadow-sm flex items-center justify-between px-container-margin h-16 pt-safe transition-transform duration-300">
<button aria-label="Go Back" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container transition-colors" onclick="history.back()">
<span class="material-symbols-outlined text-on-surface" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-surface">Select Service</h1>
<div class="w-10"></div> <!-- Placeholder for alignment -->
</header>
<!-- Main Content Area -->
<main class="flex-1 px-container-margin pt-[calc(64px+env(safe-area-inset-top,20px)+24px)] pb-[calc(100px+env(safe-area-inset-bottom,20px))]">
<!-- Progress Indicator -->
<div class="flex items-center justify-center mb-stack-gap-lg px-4">
<div class="flex items-center relative w-full max-w-xs">
<!-- Step 1 -->
<div class="flex flex-col items-center relative z-10">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-title-md text-title-md shadow-md">
                        1
                    </div>
<span class="absolute top-10 font-label-md text-label-md text-primary text-center whitespace-nowrap">Details</span>
</div>
<!-- Line -->
<div class="flex-1 h-[2px] bg-surface-variant mx-2 -mt-6"></div>
<!-- Step 2 -->
<div class="flex flex-col items-center relative z-10">
<div class="w-8 h-8 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center font-title-md text-title-md border border-outline-variant">
                        2
                    </div>
<span class="absolute top-10 font-label-md text-label-md text-on-surface-variant text-center whitespace-nowrap">Problem</span>
</div>
<!-- Line -->
<div class="flex-1 h-[2px] bg-surface-variant mx-2 -mt-6"></div>
<!-- Step 3 -->
<div class="flex flex-col items-center relative z-10">
<div class="w-8 h-8 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center font-title-md text-title-md border border-outline-variant">
                        3
                    </div>
<span class="absolute top-10 font-label-md text-label-md text-on-surface-variant text-center whitespace-nowrap">Review</span>
</div>
</div>
</div>
<div class="h-8"></div> <!-- Spacer for labels -->
<!-- Search Bar -->
<div class="mb-stack-gap-lg">
<div class="relative glass-panel rounded-xl shadow-[0_8px_30px_rgba(0,0,0,0.03)] flex items-center overflow-hidden border border-outline-variant/30 focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container transition-all">
<span class="material-symbols-outlined text-on-surface-variant ml-4" data-icon="search">search</span>
<input class="w-full bg-transparent border-none py-4 px-3 font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant focus:outline-none focus:ring-0" placeholder="Search for service (e.g. AC Repair)" type="text"/>
</div>
</div>
<!-- Main Categories -->
<section>
<h2 class="font-title-md text-title-md text-on-surface mb-stack-gap-md">Select Category</h2>
<div class="grid grid-cols-2 gap-grid-gutter" id="categoryGrid">
<!-- Category 1 -->
<div class="category-card glass-panel rounded-xl p-4 flex flex-col items-center justify-center aspect-square shadow-[0_4px_20px_rgba(0,0,0,0.02)]" onclick="selectCategory('ac')">
<div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="ac_unit">ac_unit</span>
</div>
<span class="font-title-md text-title-md text-on-surface text-center">AC Repair</span>
</div>
<!-- Category 2 -->
<div class="category-card glass-panel rounded-xl p-4 flex flex-col items-center justify-center aspect-square shadow-[0_4px_20px_rgba(0,0,0,0.02)]" onclick="selectCategory('plumbing')">
<div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="plumbing">plumbing</span>
</div>
<span class="font-title-md text-title-md text-on-surface text-center">Plumbing</span>
</div>
<!-- Category 3 -->
<div class="category-card glass-panel rounded-xl p-4 flex flex-col items-center justify-center aspect-square shadow-[0_4px_20px_rgba(0,0,0,0.02)]" onclick="selectCategory('electrical')">
<div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="electrical_services">electrical_services</span>
</div>
<span class="font-title-md text-title-md text-on-surface text-center">Electrical</span>
</div>
<!-- Category 4 -->
<div class="category-card glass-panel rounded-xl p-4 flex flex-col items-center justify-center aspect-square shadow-[0_4px_20px_rgba(0,0,0,0.02)]" onclick="selectCategory('cleaning')">
<div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="cleaning_services">cleaning_services</span>
</div>
<span class="font-title-md text-title-md text-on-surface text-center">Cleaning</span>
</div>
</div>
</section>
<!-- Sub Categories (Dynamically revealed) -->
<section class="sub-categories" id="subCategorySection">
<h3 class="font-title-md text-title-md text-on-surface mb-stack-gap-md" id="subCategoryTitle">Select Specific Service</h3>
<div class="flex flex-wrap gap-2" id="subCategoryContainer">
<!-- Chips will be populated here via JS -->
</div>
</section>
</main>
<!-- Bottom Fixed Action Area -->
<div class="fixed bottom-0 w-full z-40 glass-panel border-t border-outline-variant/20 px-container-margin py-4 pb-safe shadow-[0_-8px_30px_rgba(0,0,0,0.05)]">
<button class="w-full bg-primary-container text-on-primary-container font-title-md text-title-md py-4 rounded-lg shadow-md opacity-50 cursor-not-allowed transition-all duration-300" disabled="" id="continueBtn">
            Continue
        </button>
</div>
<script>
        const subCategories = {
            'ac': ['Split AC Service', 'Window AC Service', 'Gas Refill', 'Installation', 'Uninstallation'],
            'plumbing': ['Leakage Repair', 'Tap Repair/Replacement', 'Pipe Blockage', 'Water Tank Cleaning'],
            'electrical': ['Switchboard Repair', 'Fan Installation', 'Wiring Issues', 'MCB Tripping'],
            'cleaning': ['Deep Cleaning', 'Sofa Cleaning', 'Bathroom Cleaning', 'Kitchen Cleaning']
        };

        let currentCategory = null;
        let selectedSubCategory = null;

        function selectCategory(categoryId) {
            // Reset UI
            document.querySelectorAll('.category-card').forEach(card => card.classList.remove('selected'));
            currentCategory = categoryId;
            selectedSubCategory = null;
            updateContinueButton();

            // Highlight selected card
            const selectedCard = event.currentTarget;
            selectedCard.classList.add('selected');

            // Populate and show sub-categories
            const subContainer = document.getElementById('subCategoryContainer');
            const subSection = document.getElementById('subCategorySection');
            const title = document.getElementById('subCategoryTitle');
            
            subContainer.innerHTML = ''; // Clear existing
            
            const categoryName = selectedCard.querySelector('span').innerText;
            title.innerText = `Select ${categoryName} Service`;

            if (subCategories[categoryId]) {
                subCategories[categoryId].forEach(sub => {
                    const chip = document.createElement('div');
                    chip.className = 'sub-category-chip px-4 py-2 rounded-full border border-outline-variant bg-surface text-on-surface font-label-md text-label-md flex-shrink-0';
                    chip.innerText = sub;
                    chip.onclick = () => selectSubCategory(chip, sub);
                    subContainer.appendChild(chip);
                });
                subSection.classList.add('active');
            } else {
                subSection.classList.remove('active');
            }
            
            // Scroll a bit to show subcategories if needed
            setTimeout(() => {
                subSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 300);
        }

        function selectSubCategory(chipElement, subCategoryName) {
            document.querySelectorAll('.sub-category-chip').forEach(chip => chip.classList.remove('selected'));
            chipElement.classList.add('selected');
            selectedSubCategory = subCategoryName;
            updateContinueButton();
        }

        function updateContinueButton() {
            const btn = document.getElementById('continueBtn');
            if (currentCategory && selectedSubCategory) {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                btn.classList.add('hover:opacity-90', 'active:scale-95');
                btn.style.background = 'linear-gradient(to bottom, #b35cf5, #a540f3)'; // Slight gradient for depth
            } else {
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                btn.classList.remove('hover:opacity-90', 'active:scale-95');
                btn.style.background = '';
            }
        }
    </script>
</body></html>
