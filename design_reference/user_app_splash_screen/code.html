                        "error": "#ba1a1a",
                        "surface-container-highest": "#dce2f3",
                        "on-tertiary-fixed-variant": "#643f00",
                        "surface-container-high": "#e2e8f8",
                        "background": "#f9f9ff",
                        "surface-dim": "#d3daea",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#ffddb5",
                        "on-tertiary": "#ffffff",

                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],

                },
            },
        }

<style>
        .loader {
            border: 3px solid theme('colors.surface-variant');
            border-top: 3px solid theme('colors.primary-container');
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .pulse-gradient {
            background: radial-gradient(circle at center, rgba(165, 64, 243, 0.15) 0%, rgba(255, 255, 255, 0) 70%);
            animation: pulse-glow 3s ease-in-out infinite alternate;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.95); opacity: 0.5; }
            100% { transform: scale(1.05); opacity: 1; }
        }
    </style>
</head>
<body class="bg-surface-container-lowest text-on-surface min-h-screen flex flex-col justify-center items-center relative overflow-hidden font-body-lg">
<!-- Background Gradient Accent -->
<div class="absolute inset-0 z-0 flex items-center justify-center pointer-events-none">
<div class="w-[80vw] h-[80vw] max-w-[500px] max-h-[500px] rounded-full pulse-gradient blur-3xl"></div>
</div>
<!-- Main Content -->
<main class="z-10 flex flex-col items-center justify-center flex-grow w-full px-container-margin">
<!-- Logo Container with Glass Effect -->
<div class="relative mb-stack-gap-lg">
<div class="absolute inset-0 bg-white/40 backdrop-blur-md rounded-2xl shadow-lg border border-white/20 transform scale-110"></div>
<img alt="InFio Search Logo" class="relative z-10 w-48 h-48 object-contain rounded-xl drop-shadow-xl" src="https://lh3.googleusercontent.com/aida/AEtjO1UrG-56jzOHnblj1J9BTr7N4BEYCi4ogMRes2eiCXAaENM9gUg0c2m7ojoDHqYuQM3MK3vg8ciKNRN_pNM4-CXxbix84VfgOGChqeyolOSlCdYJdV7VNbzjJ5mpJvw6m76JukrO5NAipdQD7yN21VCvzjlZ7Obev4VOrsdvjadX2HTaOxz5J99HAgFMWw_YPya-7XBNQ3zMdQwF1ivt7XeYKggQsLApQI_4fRWnPUj85CNUYYv7K9v_4g"/>
</div>
</main>
<!-- Loading Indicator at Bottom -->
<footer class="z-10 w-full flex flex-col items-center justify-end pb-[10vh] absolute bottom-0 pointer-events-none">
<div class="loader mb-stack-gap-sm"></div>
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest opacity-80">Loading...</p>
</footer>
<script>
        // Simple script to redirect after a delay, simulating app loading
        setTimeout(() => {
            // console.log("Splash screen done, ready to navigate to main app.");
        }, 3000);
    </script>
</body></html>
